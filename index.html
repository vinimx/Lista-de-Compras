<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><i class="fas fa-shopping-cart"></i> Lista de Compras</h1>
            <div class="input-group">
                <input id="input-entrada" type="text" placeholder="O que você precisa comprar?">
                <button id="adicionar-item" type="button">
                    <i class="fas fa-plus"></i> Adicionar
                </button>
            </div>
            <p id="mensagem"><i class="fas fa-info-circle"></i> Sua lista está vazia</p>
            <ul id="lista-de-compras"></ul>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
